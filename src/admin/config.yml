backend:
  name: github
  repo: monteroana1974-ux/asociacionpanyagua
  branch: main
  # El inicio de sesión con GitHub lo resuelve la función /auth del proyecto de Cloudflare Pages
  base_url: https://asociacionpanyagua.pages.dev
  commit_messages:
    create: "Nueva {{collection}}: {{slug}}"
    update: "Cambio en {{collection}}: {{slug}}"
    delete: "Borrado en {{collection}}: {{slug}}"

locale: es
site_url: https://asociacionpanyagua.org
display_url: https://asociacionpanyagua.org
logo_url: /img/logo-jesus-es-senor.png
media_folder: src/img/subidas
public_folder: /img/subidas

collections:
  - name: charlas
    label: Charlas diarias
    label_singular: charla
    description: "Para publicar la charla del día: pulsa «Nueva charla», pega el enlace del feed de iVoox (el que termina en .xml), elige el color litúrgico y pulsa «Guardar». El título, la fecha, la imagen, la descripción y el audio se toman solos del feed de iVoox al publicar."
    folder: src/charlas
    create: true
    slug: "{{year}}-{{month}}-{{day}}-charla"
    sortable_fields: ["date", "title"]
    summary: "{{fields.title | default('Charla nueva · se completa desde iVoox al publicar')}}"
    fields:
      - label: "Enlace del feed de iVoox (.xml)"
        name: feed
        widget: string
        required: false
        pattern: ['^https://feeds\.ivoox\.com/.+\.xml', "Pega el enlace del feed de iVoox, el que empieza por https://feeds.ivoox.com/ y termina en .xml"]
        hint: "Ejemplo: https://feeds.ivoox.com/feed_fg_f13254207_filtro_1.xml — obligatorio en las charlas nuevas."
      - label: "Color litúrgico"
        name: color
        widget: select
        required: true
        options:
          - { label: "Verde", value: verde }
          - { label: "Morado", value: morado }
          - { label: "Blanco", value: blanco }
          - { label: "Rojo", value: rojo }
          - { label: "Rosa", value: rosa }
      # Estos datos los rellena la web desde el feed de iVoox; no se muestran en el panel
      - { name: title, widget: hidden, required: false }
      - { name: date, widget: hidden, required: false }
      - { name: audio, widget: hidden, required: false }
      - { name: image, widget: hidden, required: false }
      - { name: completado_desde, widget: hidden, required: false }
      - { name: body, widget: hidden, required: false }

  - name: anuncios
    label: Retiros y peregrinaciones
    label_singular: anuncio
    folder: src/anuncios
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "1. Título", name: title, widget: string }
      - { label: "2. Imagen principal", name: image, widget: image, required: false }
      - label: "3. Texto resumen"
        name: resumen
        widget: markdown
        required: false
        buttons: [bold, italic, link]
        editor_components: []
        hint: "Sale debajo de la imagen principal y en la lista de retiros. Para poner un enlace: selecciona el texto y pulsa el botón de enlace."
      - label: "Bloques 02 a 10"
        name: bloques
        widget: list
        required: false
        max: 9
        label_singular: bloque
        add_to_top: false
        summary: "{{fields.cabecera | default('Bloque sin cabecera')}}"
        hint: "Pulsa «Añadir bloque» para cada parte del anuncio (hasta 9). Todo es opcional: lo que dejes vacío no sale."
        fields:
          - { label: "Imagen", name: imagen, widget: image, required: false }
          - label: "Posición de la imagen"
            name: posicion
            widget: select
            required: false
            default: centro
            options:
              - { label: "A la derecha (tamaño medio)", value: derecha }
              - { label: "A la izquierda (tamaño medio)", value: izquierda }
              - { label: "Al centro (tamaño doble)", value: centro }
          - { label: "Cabecera", name: cabecera, widget: string, required: false }
          - label: "Texto"
            name: texto
            widget: markdown
            required: false
            hint: "Para poner un enlace (por ejemplo, la ubicación en Google Maps): selecciona el texto y pulsa el botón de enlace."
      - { name: date, widget: hidden, required: false }
      - { name: body, widget: hidden, required: false }

  - name: paginas
    label: Páginas
    files:
      - label: "¿Quiénes somos?"
        name: quienes
        file: src/quienes-somos.md
        fields:
          - { label: "Título", name: title, widget: string }
          - { label: "Cita", name: cita, widget: string, required: false }
          - { label: "Texto", name: body, widget: markdown }
          - { name: layout, widget: hidden }
          - { name: permalink, widget: hidden }
          - { name: clase, widget: hidden }
          - { name: antetitulo, widget: hidden }
          - { name: description, widget: hidden }
      - label: "Colaborar / Donaciones"
        name: colaborar
        file: src/colaborar.md
        fields:
          - { label: "Título", name: title, widget: string }
          - { label: "Cita", name: cita, widget: string }
          - { label: "Número de cuenta (IBAN)", name: iban, widget: string }
          - { label: "Banco", name: banco, widget: string }
          - { label: "Código Bizum de ONG", name: bizum, widget: string }
          - { label: "Correo de la cuenta PayPal que recibe los donativos", name: paypal, widget: string }
          - { label: "Texto", name: body, widget: markdown }
          - { name: layout, widget: hidden }
          - { name: permalink, widget: hidden }
          - { name: antetitulo, widget: hidden }
          - { name: description, widget: hidden }
      - label: "Cómo hacer un Bizum"
        name: bizum
        file: src/como-hacer-un-bizum.md
        fields:
          - { label: "Título", name: title, widget: string }
          - { label: "Texto", name: body, widget: markdown }
          - { name: layout, widget: hidden }
          - { name: permalink, widget: hidden }
          - { name: antetitulo, widget: hidden }
          - { name: cita, widget: hidden }
      - label: "Enseñanzas (vídeos)"
        name: ensenanzas
        file: src/ensenanzas.md
        fields:
          - { label: "Título", name: title, widget: string }
          - { label: "Frase de cabecera", name: cita, widget: string }
          - label: "Grupos de vídeos"
            name: grupos
            widget: list
            label_singular: grupo
            fields:
              - { label: "Título del grupo", name: titulo, widget: string }
              - label: "Vídeos"
                name: videos
                widget: list
                label_singular: vídeo
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Enlace de YouTube", name: youtube, widget: string }
                  - { label: "Descripción", name: texto, widget: text, required: false }
          - { label: "Texto final", name: body, widget: markdown, required: false }
          - { name: layout, widget: hidden }
          - { name: permalink, widget: hidden }
          - { name: antetitulo, widget: hidden }

  - name: ajustes
    label: Datos de contacto
    files:
      - label: "Contacto y redes"
        name: site
        file: src/_data/site.json
        fields:
          - { label: "Nombre", name: nombre, widget: string }
          - { label: "Lema", name: lema, widget: string }
          - { label: "Descripción para buscadores", name: descripcion, widget: text }
          - { label: "Correo electrónico", name: email, widget: string }
          - { label: "WhatsApp (con prefijo +34)", name: whatsapp, widget: string }
          - { label: "Facebook", name: facebook, widget: string }
          - { label: "YouTube", name: youtube, widget: string }
          - { name: url, widget: hidden }
